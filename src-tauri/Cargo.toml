[package]
name = "pocket-faker"
version = "0.1.0"
description = "Local developer console for a League of Legends coaching agent"
authors = ["Agustin"]
edition = "2021"

[lib]
name = "pocket_faker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29.0", default-features = false, features = ["async", "dispatch", "macos_13_0", "sc"] }
core-graphics = "0.25"
futures = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
xcap = "0.9.8"
